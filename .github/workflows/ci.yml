name: CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test, build
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      QUEUE_BACKEND: mock
      TENANT_DB_URL: postgresql://revolico:revolico@localhost:5432/revolico
      JWT_SECRET: ci-test-secret-not-for-production
      JWT_EXPIRATION: 1d
      DB_URI: mongodb://localhost:27017/jest
      REDIS_URL: redis://localhost:6379

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: revolico
          POSTGRES_PASSWORD: revolico
          POSTGRES_DB: revolico
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U revolico"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database schema
        # Uses `prisma db push` (not `prisma migrate deploy`) because the
        # migration history is broken: the first migration
        # (20250604000000_add_alarms_module) expects RoleType enum and Role
        # table to exist, but they are created by the LATER migration
        # 20250907014740_tenant_init. Fresh Postgres cannot run them in
        # order. db push reads the schema directly and matches the dev DB.
        # TODO: regenerate migrations with `prisma migrate reset` +
        # `prisma migrate dev --name init` to fix the dependency chain.
        run: npx prisma db push --skip-generate

      - name: Seed default roles
        run: npm run seed

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test
        env:
          NODE_ENV: test

      - name: Build
        run: npm run build
